allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  sharp: true
  simple-git-hooks: true
  unrs-resolver: false
  vue-demi: false
  workerd: true

cleanupUnusedCatalogs: true

ignoredBuiltDependencies:
  - vue-demi

onlyBuiltDependencies:
  - '@parcel/watcher'
  - better-sqlite3
  - esbuild
  - sharp
  - simple-git-hooks
  - unrs-resolver
  - workerd
  - '@resvg/resvg-js'

shellEmulator: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - semver@6.3.1
  - chokidar@4.0.3
  - '@unocss/webpack@66.5.10'

overrides:
  # Content and Studio still pin metadata tooling with outdated unplugin/oxc peers.
  nuxt-component-meta: 0.19.0

packageExtensions:
  h3@2.0.8:
    optionalDependencies:
      crossws: ^0.4.17
  vite-plugin-vue-devtools@9.0.0-rc.2:
    optionalDependencies:
      '@vitejs/devtools': ^0.7.6

patchedDependencies:
  '@nuxt/content@3.16.2': patches/@nuxt__content@3.16.2.patch
  '@nuxtjs/mdc@0.23.2': patches/@nuxtjs__mdc@0.23.2.patch
  nuxt-studio@1.8.0: patches/nuxt-studio@1.8.0.patch
