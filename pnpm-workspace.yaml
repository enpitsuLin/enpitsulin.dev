catalogMode: prefer

cleanupUnusedCatalogs: true

shellEmulator: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - semver@6.3.1
  - chokidar@4.0.3
  - '@unocss/webpack@66.5.10'
patchedDependencies:
  nuxt-auth-utils: patches/nuxt-auth-utils.patch

onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - unrs-resolver
